name: keep-alive

on:
  # 每 30 分钟保活一次（UTC 时间，:13/:43 避开整点）
  schedule:
    - cron: '13,43 * * * *'
  # 支持手动触发
  workflow_dispatch: {}

jobs:
  ping:
    name: 保活 ping
    runs-on: ubuntu-latest
    steps:
      # 1. 访问首页：保持 Vercel serverless 函数热（避免长时间空闲后冷启动超时），
      #    同时 SSR 会查询 Supabase，产生 API 活动。
      - name: Ping 网站
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "https://lixi-aithinking.vercel.app/")
          echo "site HTTP $code"
          test "$code" = "200"

      # 2. 直接 ping Supabase REST API：防止免费项目因 7 天无活动被自动暂停。
      #    无 key 时返回 401 属正常，只要服务有响应就算活跃。
      - name: Ping Supabase API
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "https://eoiltvhuypeeqcgwwnbj.supabase.co/rest/v1/")
          echo "supabase HTTP $code"
          test "$code" = "200" -o "$code" = "401"
